services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cfo_copilot}
      MYSQL_USER: ${MYSQL_USER:-cfo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "cfo_user", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: "until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do sleep 2; done; OLLAMA_HOST=http://ollama:11434 ollama pull $${OLLAMA_MODEL:-llama3.2:1b}"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  db-init:
    build: .
    command: python -c "from app.services.financials import ingest_all; ingest_all(); print('DATABASE INITIALIZED AND DATA INGESTED')"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-cfo_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-cfo_copilot}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-cfo_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-cfo_copilot}
      CFO_MODEL: ${CFO_MODEL:-ollama_chat/llama3.2:1b}
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-8192}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-16}
      MAX_QUEUED_REQUESTS: ${MAX_QUEUED_REQUESTS:-32}
      QUEUE_WAIT_TIMEOUT_SECONDS: ${QUEUE_WAIT_TIMEOUT_SECONDS:-1}
    depends_on:
      db-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully

  ui:
    build: .
    command: streamlit run app/main.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:
  ollama_data:
